name: Deploy DSB Master Preview

on:
  push:
    branches: [feature/dsb-land-master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'YellowBrokeIt/oogaboogaland'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out stable rock
        uses: actions/checkout@v6
        with:
          ref: rock
          path: live-src
          persist-credentials: false
      - name: Check out this preview revision
        uses: actions/checkout@v6
        with:
          path: preview-src
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Build stable root including routes and cards
        run: node live-src/scripts/site.mjs "$GITHUB_WORKSPACE/_site"
      - name: Build isolated preview
        run: |
          cd preview-src
          npm run build
          mkdir -p ../_site/dsb-preview
          cp oogaboogaland.html ../_site/dsb-preview/index.html
          mkdir -p ../_site/dsb-preview/src/js
          cp -R src/maxis-player ../_site/dsb-preview/src/maxis-player
          cp src/js/maxis-media-data.js ../_site/dsb-preview/src/js/maxis-media-data.js
      - name: Validate shoreline, Olympus and preserved exterior
        working-directory: preview-src
        run: |
          export CHROME="$(command -v google-chrome)"
          node test/run.mjs exterior-unit
          ONLY="shoreline checkpoint" node test/run.mjs water-unit dsb
      - name: Validate preview menus and preserved media contracts
        working-directory: preview-src
        run: |
          export CHROME="$(command -v google-chrome)"
          export TEST_CANVAS2D=1
          for checkpoint in "venue menus checkpoint" "radio TV correction" "studio checkpoint" "interior checkpoint"; do
            ONLY="$checkpoint" node test/run.mjs dsb-menus-unit dsb
          done
      - name: Save menu and interior review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsb-menu-review
          path: |
            preview-src/untracked/water-review
            preview-src/untracked/dsb-menu-review
            preview-src/untracked/test-ledger.json
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
