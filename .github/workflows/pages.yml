name: Deploy DSB Master Preview

on:
  push:
    branches: [feature/dsb-land-master]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: 'Merged character bundle SHA (the bot explicitly dispatches after its merge)'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'YellowBrokeIt/oogaboogaland'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out stable rock
        uses: actions/checkout@v6
        with:
          ref: rock
          path: live-src
          persist-credentials: false
      - name: Check out this preview revision
        uses: actions/checkout@v6
        with:
          path: preview-src
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Build stable root including routes and cards
        run: node live-src/scripts/site.mjs "$GITHUB_WORKSPACE/_site"
      - name: Build isolated preview
        run: |
          cd preview-src
          npm run build
          mkdir -p ../_site/dsb-preview
          cp oogaboogaland.html ../_site/dsb-preview/index.html
          mkdir -p ../_site/dsb-preview/src/js
          cp -R src/maxis-player ../_site/dsb-preview/src/maxis-player
          cp src/js/maxis-media-data.js ../_site/dsb-preview/src/js/maxis-media-data.js
      - name: Validate shared DSB presence, menus and voice contracts
        working-directory: preview-src
        run: |
          node --test worker/test/*.test.mjs
          export CHROME="$(command -v google-chrome)"
          TEST_CANVAS2D=1 LANES=1 ONLY="integration checkpoint" node test/run.mjs integration-unit dsb
      - name: Validate shoreline, Olympus and preserved exterior
        working-directory: preview-src
        run: |
          export CHROME="$(command -v google-chrome)"
          node test/run.mjs vacancy-unit
          node test/run.mjs exterior-unit
          LANES=1 VERBOSE=1 ONLY="shoreline checkpoint" node test/run.mjs water-unit dsb
      - name: Validate Chora vacancy addresses and renderer
        working-directory: preview-src
        run: |
          export CHROME="$(command -v google-chrome)"
          LANES=1 VERBOSE=1 ONLY="vacancy checkpoint" node test/run.mjs vacancy-unit dsb
      - name: Validate SVRN Society interior and review semantics
        working-directory: preview-src
        run: |
          export CHROME="$(command -v google-chrome)"
          TEST_CANVAS2D=1 LANES=1 VERBOSE=1 ONLY="SVRN checkpoint" node test/run.mjs svrn-unit dsb
          LANES=1 VERBOSE=1 ONLY="SVRN visual review" node test/run.mjs svrn-unit dsb
      - name: Validate preview menus and preserved media contracts
        working-directory: preview-src
        run: |
          export CHROME="$(command -v google-chrome)"
          export TEST_CANVAS2D=1
          for checkpoint in "venue menus checkpoint" "radio TV correction" "studio checkpoint" "interior checkpoint"; do
            ONLY="$checkpoint" node test/run.mjs dsb-menus-unit dsb
          done
      - name: Validate Portara aperture and shared portal behavior
        working-directory: preview-src
        run: |
          export CHROME="$(command -v google-chrome)"
          LANES=1 VERBOSE=1 ONLY="Portara aperture" node test/run.mjs portal-unit dsb
      # Capture has its own bounded operation clock. Only a healthy software-GPU
      # timeout reproduced on the approved checkpoint is advisory in the runner;
      # renderer, runtime, semantic and other capture errors still fail this job.
      - name: Capture DSB review evidence after all functional gates
        working-directory: preview-src
        run: |
          export CHROME="$(command -v google-chrome)"
          export DSB_REVIEW=1 DSB_CAPTURE_BASELINE=1 LANES=1
          ONLY="SVRN visual review" node test/run.mjs svrn-unit dsb
          ONLY="vacancy checkpoint" node test/run.mjs vacancy-unit dsb
          ONLY="Portara visual evidence" node test/run.mjs portal-unit dsb
          ONLY="shoreline visual evidence" node test/run.mjs water-unit dsb
          TEST_CANVAS2D=1 ONLY="venue menus checkpoint" node test/run.mjs dsb-menus-unit dsb
          TEST_CANVAS2D=1 ONLY="SVRN checkpoint" node test/run.mjs svrn-unit dsb
      - name: Save menu and interior review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsb-menu-review
          path: |
            preview-src/untracked/svrn-review
            preview-src/untracked/vacancy-review
            preview-src/untracked/water-review
            preview-src/untracked/dsb-menu-review
            preview-src/untracked/test-ledger.json
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
