name: Deploy GitHub Pages

on:
  push:
    branches: [rock]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Refresh Oogatron activity snapshot
        run: node scripts/jumbotron-data.mjs "$OOGATRON_STATS_URL"
        env:
          OOGATRON_STATS_URL: https://oogatron.ruleswithoutrulers.com/v2/stats
      - name: Build and stage site
        run: node scripts/site.mjs _site
      - name: Upload the built page for the artifact job
        uses: actions/upload-artifact@v4
        with:
          name: oogaboogaland-page
          path: oogaboogaland.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  artifact:
    name: Artifact · commit the built page after merge
    if: github.ref == 'refs/heads/rock' && github.event_name == 'push'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download the page that was deployed
        uses: actions/download-artifact@v4
        with:
          name: oogaboogaland-page
      - name: Commit the built page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f oogaboogaland.html
          if git diff --cached --quiet; then
            echo "Built page is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Rebuild site artifact [skip ci]"
          git push
