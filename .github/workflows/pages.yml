name: Deploy DSB Master Preview

on:
  push:
    branches: [feature/dsb-land-master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'YellowBrokeIt/oogaboogaland'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out stable rock
        uses: actions/checkout@v6
        with:
          ref: rock
          path: live-src
          persist-credentials: false
      - name: Check out this preview revision
        uses: actions/checkout@v6
        with:
          path: preview-src
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Build stable root including routes and cards
        run: node live-src/scripts/site.mjs "$GITHUB_WORKSPACE/_site"
      - name: Build isolated preview
        run: |
          cd preview-src
          npm run build
          mkdir -p ../_site/dsb-preview
          cp oogaboogaland.html ../_site/dsb-preview/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
